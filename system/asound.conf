# Pioneer CD: the USB sound card (C-Media) into the amplifier, through a
# volume control of our own, "Pioneer". The player sets it from its 0–100
# volume; the card's own control (Speaker) stays at full, and has only 37 steps.
pcm.!default {
    type plug
    slave.pcm "pioneervol"
}
pcm.pioneervol {
    type softvol
    slave.pcm "dmix:CARD=Device,DEV=0"
    control {
        name "Pioneer"
        card Device
    }
    min_dB -60.0
    max_dB 0.0
    resolution 601
}
ctl.!default {
    type hw
    card Device
}
