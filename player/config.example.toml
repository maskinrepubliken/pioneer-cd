# Pioneer CD, /etc/pioneer-cd/config.toml. install.sh copies this file there
# the first time; restart after a change: sudo systemctl restart pioneer-cd

[player]
# The screen's colours: "ink" (dark) or "paper" (light), as in Pioneer TV.
theme = "paper"
# The highest the volume goes (0–100; 28 is the level that sounded right),
# the screen's brightness (%), minutes without a press before the screen
# goes dark (0: never), and dB more for Bluetooth, which phones send quieter.
volume_cap = 60
brightness = 100
sleep_minutes = 10
bluetooth_boost = 8

[jellyfin]
# Base URL of Jellyfin, an API key (Jellyfin: Dashboard → API Keys) and the
# user whose library is shown (empty: the first administrator). With no key
# the Jellyfin source says it is not set up.
url = "http://100.123.142.8:8096"
api_key = ""
user = ""

# Sveriges Radio's channels, by SR's id (api.sr.se/api/v2/channels). Without
# this list: P1, P2, P3 and P4 Sjuhärad.
# [radio]
# channels = [
#   { id = 132, name = "P1" },
#   { id = 163, name = "P2" },
#   { id = 164, name = "P3" },
#   { id = 701, name = "P4" },   # P4 Stockholm
# ]
